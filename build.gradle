project.ext.versionDirs = [
    '1.20.1' : file("versions/1.20-1.20.1"),
    '1.20.4' : file("versions/1.20.2-1.20.4"),
    '1.20.6' : file("versions/1.20.5-1.20.6"),
    '1.19.4' : file("versions/1.19.4"),
    '1.19.3' : file("versions/1.19.3"),
    '1.19.2' : file("versions/1.19-1.19.2"),
]

project.ext.loaderMap = [
    '1.20.1' : ['fabric', 'forge'],
    '1.20.4' : ['fabric', 'forge'],
    '1.20.6' : ['fabric', 'neoforge'],
    '1.19.4' : ['fabric', 'forge'],
    '1.19.3' : ['fabric', 'forge'],
    '1.19.2' : ['fabric', 'forge'],
]

project.ext.versionAliases = [
    '1201' : '1.20.1', '1204' : '1.20.4', '1206' : '1.20.6',
    '1194' : '1.19.4', '1193' : '1.19.3', '1192' : '1.19.2',
    '1'    : '1.20.1', '4'    : '1.20.4', '6'    : '1.20.6',
]

def _isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def _reqVer    = project.hasProperty('ver')    ? project.property('ver').toString()    : null
def _reqLoader = project.hasProperty('loader') ? project.property('loader').toString() : null
def _vDirs     = project.ext.versionDirs
def _lMap      = project.ext.loaderMap
def _aliases   = project.ext.versionAliases

def _gw = { File dir ->
    _isWindows ? new File(dir, 'gradlew.bat').absolutePath : new File(dir, 'gradlew').absolutePath
}

def _pickLoader = { String ver ->
    if (_reqLoader == 'forge') return _lMap[ver].find { it != 'fabric' }
    _reqLoader ?: _lMap[ver][0]
}

def _resolveVer = {
    if (_reqVer == null) return '1.20.1'
    if (_vDirs.containsKey(_reqVer)) return _reqVer
    if (_aliases.containsKey(_reqVer)) return _aliases[_reqVer]
    def match = _vDirs.keySet().find { it.startsWith(_reqVer) }
    if (match) return match
    return _reqVer
}

def _rv = _resolveVer()
def _rl = _pickLoader(_rv)
def _rd = _vDirs[_rv]

if (_rd == null) {
    logger.warn("WARNING: version '${_rv}' (raw: -Pver=${_reqVer}) not found.")
    logger.warn("Available: ${_vDirs.keySet()}  Aliases: ${_aliases.keySet()}")
}

// ========================
//  build tasks
// ========================

task buildAll    { group = 'world importer'; description = 'Build all versions and all loaders' }
task buildFabric { group = 'world importer'; description = 'Build Fabric for all versions' }
task buildForge  { group = 'world importer'; description = 'Build Forge/NeoForge for all versions' }

_vDirs.each { ver, dir ->
    _lMap[ver].each { loader ->
        def tn = "build_${ver.replace('.', '_')}_${loader}"
        task(tn, type: Exec) {
            group = 'world importer'
            description = "Build ${loader} for MC ${ver}"
            workingDir dir
            commandLine _gw(dir), "${loader}:build", '--no-daemon'
        }
        buildAll.dependsOn tn
        if (loader == 'fabric') buildFabric.dependsOn tn
        else                    buildForge.dependsOn tn
    }
}

// ========================
//  runClient / runServer
// ========================

if (_rd != null) {
    task runClient(type: Exec) {
        group = 'world importer'
        description = 'Run client. -Pver=X -Ploader=X'
        doFirst { println ">>> runClient: MC ${_rv}, loader ${_rl}" }
        workingDir _rd
        standardInput = System.in
        commandLine _gw(_rd), "${_rl}:runClient", '--no-daemon', '--console=plain'
    }

    task runServer(type: Exec) {
        group = 'world importer'
        description = 'Run server. -Pver=X -Ploader=X'
        doFirst { println ">>> runServer: MC ${_rv}, loader ${_rl}" }
        workingDir _rd
        standardInput = System.in
        commandLine _gw(_rd), "${_rl}:runServer", '--no-daemon', '--console=plain'
    }
} else {
    task runClient { doFirst { throw new GradleException(
        "Version '${_reqVer}' not found.\nAvailable -Pver values: 1201, 1204, 1206 (or 1, 4, 6)"
    )}}
    task runServer { doFirst { throw new GradleException(
        "Version '${_reqVer}' not found.\nAvailable -Pver values: 1201, 1204, 1206 (or 1, 4, 6)"
    )}}
}

// ========================
//  clean tasks
// ========================

task cleanAll { group = 'world importer'; description = 'Clean all versions' }

_vDirs.each { ver, dir ->
    def tn = "clean_${ver.replace('.', '_')}"
    task(tn, type: Exec) {
        group = 'world importer'
        description = "Clean MC ${ver}"
        workingDir dir
        commandLine _gw(dir), 'clean', '--no-daemon'
    }
    cleanAll.dependsOn tn
}

// ========================
//  collect artifacts
// ========================

task collectJars(dependsOn: buildAll) {
    group = 'world importer'
    description = 'Collect all built jars into build/libs/'
    doLast {
        def outDir = file("release")
        outDir.mkdirs()
        _vDirs.each { ver, vdir ->
            _lMap[ver].each { loader ->
                def libsDir = new File(vdir, "${loader}/build/libs")
                if (libsDir.exists()) {
                    libsDir.listFiles().findAll {
                        it.name.endsWith('.jar') && !it.name.contains('-sources') && !it.name.contains('-dev-shadow')
                    }.each { jar ->
                        def newName = jar.name.contains(loader) ? jar.name : jar.name.replace(".jar", "-${loader}.jar")
                        new File(outDir, newName).bytes = jar.bytes
                        println "Collected: ${newName}"
                    }
                }
            }
        }
    }
}

// ========================
//  default build
// ========================

task build {
    group = 'world importer'
    description = 'Build. -Pver=X -Ploader=X to filter'
}

if (_reqVer && _reqLoader && _rd) {
    build.dependsOn "build_${_rv.replace('.', '_')}_${_rl}"
} else if (_reqLoader == 'fabric') {
    build.dependsOn buildFabric
} else if (_reqLoader == 'forge') {
    build.dependsOn buildForge
} else if (_reqVer && _rd) {
    _lMap[_rv].each { loader ->
        build.dependsOn "build_${_rv.replace('.', '_')}_${loader}"
    }
} else if (!_reqVer) {
    build.dependsOn buildAll
}
