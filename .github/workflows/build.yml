name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-1_19-1_19_2:
    name: "MC 1.19 ~ 1.19.2 (Fabric + Forge)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x versions/1.19-1.19.2/gradlew
      - run: ./gradlew build -Pver=1.19.2
      - uses: actions/upload-artifact@v4
        with:
          name: world_importer-1.19-1.19.2
          path: |
            versions/1.19-1.19.2/fabric/build/libs/*.jar
            versions/1.19-1.19.2/forge/build/libs/*.jar
            !**/*-sources.jar
            !**/*-dev-shadow.jar

